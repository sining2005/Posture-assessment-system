[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-assessment-desktop"
version = "0.1.0"
description = "PySide6 desktop posture assessment system"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5"]
hardware = [
  "open3d==0.19.0",
  "pykinect-azure==0.0.4",
]

[project.scripts]
posture-assessment = "posture_assessment.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
